# Copy this directory, add the three files listed under secretGenerator, set
# your host name and email address, then apply it:  kubectl apply -k <directory>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Keep in step with the namespace of the k3s overlay.
namespace: casdoor
resources:
  # Or a pinned remote base, for example:
  # https://github.com/thesmos-project/casdoor-integration//recipes/kubernetes/k3s?ref=<commit>
  - ../k3s
components:
  # Let's Encrypt certificate, renewed automatically by cert-manager. Remove this
  # line to provide the casdoor-tls certificate yourself.
  - ../cert-manager
secretGenerator:
  - name: casdoor-config
    files:
      - app.conf
      - admin-password
      - db-ca.pem
images:
  # Pin the release digest from docs/REGISTRY.md.
  - name: registry.thesmos.dev/thesmos/casdoor
    digest: sha256:8616a2521c1aa1ed90fa612200fee598a40fe058ded14fb7bd9b2cb5a597a6a3
patches:
  - target:
      kind: Ingress
      name: casdoor
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: auth.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: auth.example.com
  - target:
      kind: Ingress
      name: casdoor-http-redirect
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: auth.example.com
  - target:
      kind: Issuer
      name: casdoor-letsencrypt
    patch: |-
      - op: replace
        path: /spec/acme/email
        value: admin@example.com
