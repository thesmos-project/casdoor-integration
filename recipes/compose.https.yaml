# HTTPS overlay for recipes/compose.yaml:
#   CASDOOR_DOMAIN=auth.example.com docker compose -f recipes/compose.yaml -f recipes/compose.https.yaml up -d
# Set origin and originFrontend in app.conf to https://$CASDOOR_DOMAIN.
services:
  proxy:
    image: caddy@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    depends_on: [casdoor]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    environment:
      CASDOOR_DOMAIN: ${CASDOOR_DOMAIN:?set CASDOOR_DOMAIN to the public host name}
    ports:
      - "${CASDOOR_HTTP_PORT:-80}:80"
      - "${CASDOOR_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy-data:
  caddy-config:
