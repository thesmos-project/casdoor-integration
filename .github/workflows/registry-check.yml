name: Check registry access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REGISTRY_URL: ${{ vars.REGISTRY_URL }}
      REGISTRY_IMAGE: ${{ vars.REGISTRY_IMAGE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate destination
        run: python3 scripts/registry-settings.py
      - name: Verify credentials are available
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          test -n "$REGISTRY_USERNAME" || { echo 'REGISTRY_USERNAME is unavailable to this repository.' >&2; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo 'REGISTRY_PASSWORD is unavailable to this repository.' >&2; exit 1; }
      - name: Check registry login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Check authenticated upload access and cancel the probe
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: python3 scripts/check-registry-upload.py
      - name: Record result
        run: echo 'Registry login and upload creation/cancellation succeeded. No image was pushed; publication acceptance remains separate.' >> "$GITHUB_STEP_SUMMARY"
