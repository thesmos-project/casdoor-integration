name: Check build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate pinned build inputs
        run: python3 scripts/validate-project.py
      - name: Prepare source
        run: python3 scripts/prepare-source.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and run regression tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-image.py
      - name: Verify image notice and corresponding source coverage
        run: |
          container=$(docker create casdoor-integration:candidate)
          docker cp "$container:/licenses" .local/image-licenses
          docker rm "$container"
          python3 scripts/distribution-report.py .local/image-licenses --require-complete --output .local/distribution-report.json
          python3 scripts/make-sbom.py .local/image-licenses .local/distribution.spdx.json
      - name: Verify missing configuration is refused
        run: |
          set +e
          docker run --rm casdoor-integration:candidate > .local/missing-config.log 2>&1
          result=$?
          set -e
          if [ "$result" -ne 1 ]; then
            echo 'Image unexpectedly started without mounted configuration.' >&2
            exit 1
          fi
          grep -F 'Mount a readable Casdoor configuration' .local/missing-config.log
      - name: Verify configurable runtime and restart persistence
        run: python3 scripts/smoke-image.py
      - name: Verify the recipe with TLS PostgreSQL, secure startup and MFA
        run: python3 scripts/recipe-acceptance.py
      - name: Verify upgrade from the latest release, rollback, key rotation and restore
        run: python3 scripts/upgrade-acceptance.py
      - name: Verify the HTTPS overlay, secure cookies and persistent storage
        run: python3 scripts/https-acceptance.py
      - name: Measure capacity within the recipe limits
        run: python3 scripts/capacity-acceptance.py
      - name: Install pinned k3d and kubectl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/k3d" https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  $RUNNER_TEMP/bin/k3d" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
          echo "65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/k3d" "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify the Kubernetes recipe on k3s
        run: python3 scripts/kubernetes-acceptance.py
      - name: Record candidate image identity
        run: docker image inspect casdoor-integration:candidate --format '{{json .}}' > .local/image-inspection.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-build-provenance
          path: |
            .local/source/integration-provenance.json
            .local/build-metadata.json
            .local/image-inspection.json
            .local/distribution-report.json
            .local/image-smoke.json
            .local/recipe-acceptance.json
            .local/upgrade-acceptance.json
            .local/https-acceptance.json
            .local/capacity-acceptance.json
            .local/kubernetes-acceptance.json
            .local/distribution.spdx.json
          include-hidden-files: true
          retention-days: 14
